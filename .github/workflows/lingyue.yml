name: Deploy Lingyue and sync knowledge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingyue-production
  cancel-in-progress: false
jobs:
  publish:
    if: vars.LINGYUE_AUTO_SYNC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      LINGYUE_D1_ID: ${{ vars.LINGYUE_D1_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fill the deployment database binding
        run: node cloudflare/scripts/configure.mjs
      - run: pnpm --dir cloudflare check
      - run: pnpm --dir cloudflare test
      - name: Build blog and private knowledge snapshot
        run: pnpm build
      - run: pnpm --dir cloudflare migrate
      - name: Synchronize knowledge before deploying the API
        run: pnpm --dir cloudflare sync
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      - run: pnpm --dir cloudflare deploy
